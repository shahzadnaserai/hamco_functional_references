<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>mizan — the architecture, in one file</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF9F6;--paper-2:#F0EEE7;--surface:#FFF;--panel:#EDE8DD;--hover:#F2EEE6;
 --ink:#1A2230;--slate:#586273;--slate-2:#3C4554;--line:#E5E0D6;--line-light:#EFEDE7;
 --copper:#B0692E;--copper-soft:rgba(176,105,46,.10);--emerald:#059669;--alert:#DC2626;--amber:#B45309;--blue:#1D4ED8;--violet:#6D28D9}
*{box-sizing:border-box;min-width:0}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
#app{display:flex;flex-direction:column;height:100vh}
.top{flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(250,249,246,.95);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.wm{font-size:19px;font-weight:700;letter-spacing:-.03em}.wm i{font-style:normal;color:var(--copper)}
.sub{font-size:12.5px;color:var(--slate)}
.stats{margin-inline-start:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
.stats::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:11px;color:var(--slate-2);white-space:nowrap}
.chip b{color:var(--ink)}.chip.ok b{color:var(--emerald)}.chip.warn b{color:var(--amber)}
.tabs{display:flex;gap:2px;margin-inline-start:12px;padding-inline-start:14px;border-inline-start:1px solid var(--line)}
.tab{padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--slate);border-radius:4px;cursor:pointer;border:0;background:none;font-family:inherit;white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--ink)}.tab.on{background:var(--copper);color:#fff;font-weight:600}
input.q{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:inherit;width:190px;color:var(--ink)}
input.q:focus{outline:0;border-color:var(--copper)}

.cols{flex:1;display:grid;grid-template-columns:270px 330px 1fr;overflow:hidden;min-height:0}
@media(max-width:1100px){.cols{grid-template-columns:230px 280px 1fr}}
.col{overflow-y:auto;border-inline-end:1px solid var(--line);padding:12px 0 60px}
.col:last-child{border-inline-end:0;padding:22px 28px 80px}
.ch{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#9A9384;font-weight:700;padding:4px 16px 9px;position:sticky;top:0;background:var(--paper);z-index:2}
.row{display:block;width:100%;text-align:start;padding:9px 16px;border:0;border-inline-start:2px solid transparent;
 background:none;font-family:inherit;cursor:pointer;color:inherit}
.row:hover{background:var(--hover)}
.row.on{background:var(--copper-soft);border-inline-start-color:var(--copper)}
.row .rid{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--copper)}
.row .rn{font-size:13px;font-weight:550;line-height:1.35;margin-top:2px}
.row .rm{font-size:11.5px;color:var(--slate);margin-top:3px;line-height:1.4}
.row.gap{border-inline-start-color:var(--alert)}
.row.gap .rid{color:var(--alert)}
.pill{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 padding:2px 6px;border-radius:999px;margin-inline-start:6px;vertical-align:middle;white-space:nowrap}
.pill.w{background:var(--panel);color:var(--slate-2)}
.pill.ok{background:rgba(5,150,105,.12);color:var(--emerald)}
.pill.bad{background:rgba(220,38,38,.11);color:var(--alert)}
.pill.mod{background:rgba(29,78,216,.10);color:var(--blue)}
.pill.ctl{background:rgba(109,40,217,.10);color:var(--violet)}

h1{font-size:25px;font-weight:700;letter-spacing:-.025em;margin:0 0 4px;line-height:1.2}
.lede{color:var(--slate);font-size:14px;margin:0 0 18px;max-width:78ch;line-height:1.6}
h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#9A9384;font-weight:700;margin:26px 0 10px}
.kv{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:7px 16px;font-size:13.4px;margin-bottom:6px}
.kv dt{color:var(--slate);font-weight:500}.kv dd{margin:0;color:var(--slate-2);line-height:1.55}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:13px;margin-bottom:8px}
th{background:var(--panel);text-align:start;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate-2);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line-light);vertical-align:top;line-height:1.5;color:var(--slate-2)}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--hover)}
.tw{overflow-x:auto;border-radius:9px;margin-bottom:8px}
.tw table{margin:0;border-radius:0;border:0}
.note{background:var(--paper-2);border-inline-start:3px solid var(--copper);border-radius:0 8px 8px 0;padding:12px 15px;font-size:13px;color:var(--slate-2);line-height:1.6;margin:12px 0;max-width:80ch}
.note.bad{border-inline-start-color:var(--alert)}
.note b{color:var(--ink)}
.lnk{color:var(--copper);cursor:pointer;text-decoration:none;border-bottom:1px dotted rgba(176,105,46,.45)}
.lnk:hover{border-bottom-style:solid}
.empty{color:var(--slate);font-size:13.5px;padding:40px 4px;max-width:60ch;line-height:1.6}
code{font-family:'JetBrains Mono',monospace;font-size:.87em;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:1px 5px}

/* ── the map ── */
.map{padding:16px 20px 70px;overflow:auto;height:100%}
.band{margin-bottom:18px}
.bandh{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#9A9384;font-weight:700;margin:0 0 9px}
.flow{display:flex;align-items:stretch;gap:0}
.vs{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;display:flex;flex-direction:column}
.vs.newst{border-color:var(--emerald);box-shadow:0 0 0 2px rgba(5,150,105,.09)}
.vs h3{margin:0 0 2px;font-size:12px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.vs h3 .vid{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--copper);font-weight:700}
.vs .vo{font-size:10.5px;color:var(--slate);line-height:1.35;margin-bottom:8px;min-height:28px}
.arrow{flex:0 0 20px;display:flex;align-items:center;justify-content:center;color:var(--copper);font-size:17px;opacity:.55}
.chip2{display:block;width:100%;text-align:start;border:1px solid var(--line);border-inline-start-width:3px;background:var(--paper);
 border-radius:6px;padding:5px 7px;margin-bottom:4px;cursor:pointer;font-family:inherit;color:inherit;position:relative}
.chip2:hover{background:var(--hover);border-color:var(--copper)}
.chip2 .cid{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--slate)}
.chip2 .cn{font-size:11px;line-height:1.3;font-weight:500;margin-top:1px}
.chip2 .dots{position:absolute;top:5px;inset-inline-end:6px;display:flex;gap:3px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.ctl{background:var(--violet)}.dot.gap{background:var(--alert)}
.chip2.w1{border-inline-start-color:var(--copper)}
.chip2.w2{border-inline-start-color:var(--emerald)}
.chip2.w3{border-inline-start-color:var(--blue)}
.chip2.w3a{border-inline-start-color:var(--violet)}
.chip2.w4{border-inline-start-color:var(--amber)}
.chip2.w5{border-inline-start-color:#9A9384}
.chip2.undec{background:transparent;border-style:dashed;opacity:.72}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--surface);
 border:1px solid var(--line);border-radius:10px;margin-bottom:16px;font-size:11.5px;color:var(--slate-2)}
.legend .li{display:flex;align-items:center;gap:6px}
.swatch{width:14px;height:11px;border-radius:3px;border:1px solid var(--line);border-inline-start-width:3px}
.mapnote{font-size:12px;color:var(--slate);line-height:1.55;max-width:96ch;margin:0 0 14px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="wm">m<i>i</i>zan</span>
    <span class="sub">the architecture, in one file</span>
    <nav class="tabs">
      <button class="tab on" data-view="map">Map</button>
      <button class="tab" data-view="explore">Explore</button>

      <button class="tab" data-view="validate">Validate</button>

</div>

osted receipt with variance","measure":"Receipt accuracy, dock-to-stock","module":null,"stream":"V2","wave":1,"subs":["2.3.1","2.3.2","2.3.3","2.3.4","2.3.5"],"controls":["C06"]},{"id":"2.4","name":"Put away and locate","owner":"Inbound supervisor","output":"Stock in a compliant location","measure":"Putaway cycle time","module":null,"stream":"V2","wave":1,"subs":["2.4.1","2.4.2","2.4.3","2.4.4"],"controls":["C07"]},{"id":"2.5","name":"Control stock","owner":"Inventory controller","output":"A ledger that reconciles","measure":"Inventory record accuracy","module":null,"stream":"V2","wave":1,"subs":["2.5.1","2.5.2","2.5.3","2.5.4","2.5.5"],"controls":["C05"]},{"id":"2.6","name":"Count and adjust","owner":"Inventory controller","output":"An adjusted, explained balance","measure":"Count coverage, adjustment value","module":null,"stream":"V2","wave":1,"subs":["2.6.1","2.6.2","2.6.3","2.6.4"],"controls":["C09"]},{"id":"2.7","name":"Monitor storage conditions","owner":"Compliance officer","output":"A continuous condition record","measure":"Excursion count, time to hold","module":null,"stream":"V2","wave":3,"subs":[],"controls":["C08"]},{"id":"3.1","name":"Receive and promise order","owner":"Outbound supervisor","output":"An accepted order with a promised date","measure":"Order promise accuracy","module":null,"stream":"V3","wave":2,"subs":["3.1.1","3.1.2","3.1.3","3.1.4"],"controls":["C24"]},{"id":"3.2","name":"Allocate and release","owner":"Outbound supervisor","output":"An allocation that respects FEFO and holds","measure":"FEFO compliance, allocation failures","module":null,"stream":"V3","wave":2,"subs":["3.2.1","3.2.2","3.2.3","3.2.4"],"controls":["C10","C11"]},{"id":"3.3","name":"Pick, pack and stage","owner":"Outbound supervisor","output":"A verified, staged shipment","measure":"Pick accuracy, lines per hour","module":null,"stream":"V3","wave":2,"subs":["3.3.1","3.3.2","3.3.3","3.3.4"],"controls":["C12"]},{"id":"3.4","name":"Load and dispatch","owner":"Outbound supervisor","output":"A dispatched load with a compliant carrier","measure":"On-time dispatch","module":null,"stream":"V3","wave":2,"subs":["3.4.1","3.4.2","3.4.3","3.4.4"],"controls":["C12","C13"]},{"id":"3.5","name":"Confirm delivery","owner":"Outbound supervisor","output":"Proof of delivery on the job file","measure":"POD capture rate, POD age","module":null,"stream":"V3","wave":2,"subs":["3.5.1","3.5.2","3.5.3","3.5.4"],"controls":["C14"]},{"id":"4.1","name":"Authorise return","owner":"Client services","output":"An RMA linked to the original dispatch","measure":"Unauthorised return rate","module":null,"stream":"V4","wave":3,"subs":[],"controls":[]},{"id":"4.2","name":"Receive and grade","owner":"Inbound supervisor","output":"A graded return with evidence","measure":"Grading cycle time","module":null,"stream":"V4","wave":3,"subs":[],"controls":[]},{"id":"4.3","name":"Disposition","owner":"Inventory controller","output":"Resell, refurbish, quarantine or destroy","measure":"Recovery value rate","module":null,"stream":"V4","wave":3,"subs":[],"controls":[]},{"id":"5.1","name":"Capture billable activity","owner":"Finance","output":"Rated activity against the snapshot","measure":"Unbilled activity value","module":null,"stream":"V5","wave":2,"subs":["5.1.1","5.1.2","5.1.3","5.1.4"],"controls":[]},{"id":"5.2","name":"Rate and accrue","owner":"Finance","output":"A continuously accurate draft","measure":"Month-end close days","module":null,"stream":"V5","wave":2,"subs":["5.2.1","5.2.2","5.2.3","5.2.4"],"controls":[]},{"id":"5.3","name":"Approve and issue","owner":"Finance","output":"An approved invoice","measure":"Invoices issued on day one","module":null,"stream":"V5","wave":2,"subs":["5.3.1","5.3.2","5.3.3","5.3.4"],"controls":["C15","C16"]},{"id":"5.4","name":"Clear and report","owner":"Finance","output":"A cleared tax invoice","measure":"Clearance success rate","module":null,"stream":"V5","wave":1,"subs":["5.4.1","5.4.2","5.4.3","5.4.4"],"controls":["C17"]},{"id":"5.5","name"   [D.meta.uncovered ? 'warn' : 'ok', D.meta.covered + '/' + D.meta.l2 + ' covered'],
  [D.meta.ctrlImplemented === D.meta.controls ? 'ok' : 'warn', D.meta.ctrlImplemented + '/' + D.meta.controls + ' controls'],
].map(([k, t]) => '<span class="chip ' + k + '"><b>' + t + '</b></span>').join('');

const wavePill = w => w == null ? '' : '<span class="pill w">wave ' + (w === 3.1 ? '3a' : w) + '</span>';
const featRows = ids => ids.length
  ? '<div class="tw"><table><thead><tr><th>Feature</th><th>What it does</th></tr></thead><tbody>'
    + ids.map(f => '<tr><td class="mono">' + f + '</td><td>' + esc(D.featureName[f] || '') + '</td></tr>').join('')
    + '</tbody></table></div>'
  : '<div class="note bad"><b>No feature implements this sub-process.</b></div>';

const waveClass = w => w == null ? 'undec' : (w === 3.1 ? 'w3a' : 'w' + w);
const waveLabel = w => w == null ? 'not sequenced' : (w === 3.1 ? '3a' : w);

function renderMap() {
  $('cols').style.gridTemplateColumns = '1fr';
  $('c1').style.display = $('c2').style.display = 'none';
  const col = s => {
    const st = D.streams.find(x => x.id === s);
    const ps = st.processes.map(P).filter(p => !q || (p.id + ' ' + p.name + ' ' + p.owner).toLowerCase().includes(q));
    const isNew = s === 'V6' || s === 'V7';
    return '<div class="vs' + (isNew ? ' newst' : '') + '">'
      + '<h3><span class="vid">' + s + '</span> ' + esc(st.name) + '</h3>'
      + '<div class="vo">' + esc(st.outcome) + '</div>'
      + ps.map(p => {
          const dec = p.subs.length, gap = p.subs.map(S).some(x => x && x.gap);
          return '<button class="chip2 ' + waveClass(p.wave) + (dec ? '' : ' undec') + '" data-p="' + p.id + '" '
            + 'title="' + esc(p.name + ' · ' + p.owner + ' · wave ' + waveLabel(p.wave) + (dec ? ' · ' + dec + ' sub-processes' : ' · not decomposed')) + '">'
            + '<div class="dots">' + (p.controls.length ? '<span class="dot ctl"></span>' : '') + (gap ? '<span class="dot gap"></span>' : '') + '</div>'
            + '<div class="cid">' + p.id + '</div><div class="cn">' + esc(p.name) + '</div></button>';
        }).join('')
      + '</div>';
  };
  $('c3').outerHTML = '<div class="map" id="c3"></div>';
  $('c3').innerHTML =
    '<div class="legend">'
    + '<b style="color:var(--ink)">Wave</b>'
    + [['w1','1'],['w2','2'],['w3','3'],['w3a','3a'],['w4','4'],['w5','5']]
        .map(([c,l]) => '<span class="li"><span class="swatch ' + c + '" style="border-inline-start-color:' + ({w1:'var(--copper)',w2:'var(--emerald)',w3:'var(--blue)',w3a:'var(--violet)',w4:'var(--amber)',w5:'#9A9384'})[c] + '"></span>' + l + '</span>').join('')
    + '<span class="li"><span class="swatch" style="border-style:dashed;border-inline-start-color:#9A9384;background:transparent"></span>not decomposed</span>'
    + '<span class="li"><span class="dot ctl"></span>a control fires here</span>'
    + '<span class="li"><span class="dot gap"></span>a sub-process has no feature</span>'
    + '</div>'
    + '<p class="mapnote">Every box is a level-1 process. <b>Colour is the wave it ships in; a dashed box is not yet decomposed to level 2</b> — that is a decision, not an omission. '
    + 'The top row reads left to right in the order work actually flows; <b>V6 and V7 are the two streams decision D2 added</b> and they are outlined in green. '
    + 'Click any box for its sub-processes, the module that executes them, the control that fires and the features that implement it.</p>'
    + '<div class="band"><div class="bandh">Operating — each delivers an outcome to a paying customer</div>'
    + '<div class="flow">' + D.flow.map((s, i) => (i ? '<div class="arrow">→</div>' : '') + col(s)).join('') + '</div></div>'
    + '<div class="band"><div class="bandh">Enabling — no customer of their own; every control in E1 fires inside an operating step</div>'
    + '<div class="flow">' + D.enabling.map(col).join('') + '</div></div>';
}

function renderDomain() {
  $('cols').style.gridTemplateColumns = '1fr';
  $('c1').style.display = $('c2').style.display = 'none';
  const hit = t => !q || JSON.stringify(t).toLowerCase().includes(q);
  $('c3').innerHTML = '<h1>The nouns this architecture uses</h1>'
    + '<p class="lede"><b>A leg is ' + esc(D.legDef) + '.</b> It carries its own status, its own rate basis '
    + 'and its own captured activity. A job has one or more legs; a leg belongs to exactly one service head '
    + 'and exactly one job. <b>The word appeared 35 times across six deliverables before it was defined once</b> — '
    + 'full detail in deliverable 17.</p>'
    + '<h2>The seven nouns, in dependency order</h2>'
    + '<div class="tw"><table><thead><tr><th>Noun</th><th>What it means</th><th>Owner</th><th>Source</th></tr></thead><tbody>'
    + D.nouns.filter(hit).map(n => '<tr><td><b>' + esc(n.noun) + '</b></td><td>' + esc(n.def) + '</td><td>' + esc(n.owner) + '</td><td>' + esc(n.src) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<h2>Job types — derived from the client’s 23 agreements, not invented</h2>'
    + '<div class="tw"><table><thead><tr><th>Job type</th><th>Model</th><th>Legs</th><th>Which value streams execute</th></tr></thead><tbody>'
    + D.jobTypes.filter(hit).map(j => '<tr><td><b>' + esc(j.type) + '</b></td><td class="mono">' + esc(j.model) + '</td><td>' + esc(j.legs) + '</td><td>' + esc(j.streams) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="note"><b>Of these job types, the process architecture decomposed one</b> — 3PL warehousing. '
    + '<b>Ten of the twenty-three agreements in the client’s own library are 2PL</b>, where the client receives '
    + 'and picks their own goods and the operator provides space, electricity and attestation. '
    + 'A 2PL job runs V1 to acquire it and V5 to bill it and almost nothing between. '
    + 'That is an over-service rather than a gap, and it is one field to fix — deliverable 17 §4.</div>'
    + '<h2>Storage natures — the input that decides which compliance rules fire</h2>'
    + '<div class="tw"><table><thead><tr><th>#</th><th>Nature</th><th>Temperature</th><th>Regulator</th></tr></thead><tbody>'
    + D.natures.filter(hit).map(n => '<tr><td class="mono">' + n.n + '</td><td>' + esc(n.nature) + '</td><td>' + esc(n.temp) + '</td><td>' + esc(n.reg) + '</td></tr>').join('')
    + '</tbody></table></div>';
}

function render() {
  if (view === 'map') return renderMap();
  if (view === 'domain') { if (!document.getElementById('c3').classList.contains('col')) resetCols(); return renderDomain(); }
  if (view === 'explore') { if (!document.getElementById('c3').classList.contains('col')) resetCols(); return renderExplore(); }
  if (view === 'controls') { if (!document.getElementById('c3').classList.contains('col')) resetCols(); return renderControls(); }
  if (!document.getElementById('c3').classList.contains('col')) resetCols();
  return renderValidate();
}

function resetCols() { $('c3').outerHTML = '<div class="col" id="c3"></div>'; }

function renderExplore() {
  $('cols').style.gridTemplateColumns = '270px 330px 1fr';
  $('c1').style.display = $('c2').style.display = '';
  const hit = p => !q || (p.id + ' ' + p.name + ' ' + p.owner + ' ' + p.output + ' ' + p.measure).toLowerCase().includes(q)
    || p.subs.some(id => { const x = S(id); return x && (x.id + ' ' + x.name + ' ' + x.flow + ' ' + x.control + ' ' + x.features.join(' ')).toLowerCase().includes(q); });
  $('c1').innerHTML = '<div class="ch">Level 0 · value streams</div>' + D.streams.map(s => {
    const n = s.processes.filter(id => hit(P(id))).length;
    return '<button class="row' + (s.id === sel.stream ? ' on' : '') + '" data-s="' + s.id + '">'
      + '<span class="rid">' + s.id + '</span> <span class="pill w">' + n + '</span>'
      + '<div class="rn">' + esc(s.name) + '</div>'
      + '<div class="rm">' + esc(s.outcome) + '</div></button>';
  }).join('');
  const ps = D.streams.find(s => s.id === sel.stream).processes.map(P).filter(hit);
  $('c2').innerHTML = '<div class="ch">Level 1 · processes</div>' + (ps.length ? ps.map(p =>
    '<button class="row' + (p.id === sel.proc ? ' on' : '') + '" data-p="' + p.id + '">'
    + '<span class="rid">' + p.id + '</span>' + wavePill(p.wave)
    + (p.subs.length ? '<span class="pill ok">L2 ×' + p.subs.length + '</span>' : '')
    + (p.controls.length ? '<span class="pill ctl">' + p.controls.join(' ') + '</span>' : '')
    + '<div class="rn">' + esc(p.name) + '</div>'
    + '<div class="rm">' + esc(p.owner) + ' · ' + esc(p.measure) + '</div></button>').join('')
    : '<div class="empty" style="padding-inline:16px">No process in this stream matches.</div>');
  $('c3').innerHTML = sel.proc ? procDetail(P(sel.proc)) : streamDetail(D.streams.find(s => s.id === sel.stream));
}

function streamDetail(s) {
  const ps = s.processes.map(P);
  const subs = ps.reduce((n, p) => n + p.subs.length, 0);
  return '<h1>' + s.id + ' · ' + esc(s.name) + '</h1>'
    + '<p class="lede">' + esc(s.trigger) + ' → ' + esc(s.outcome) + '</p>'
    + '<dl class="kv"><dt>Customer</dt><dd>' + esc(s.customer) + '</dd>'
    + '<dt>Level-1 processes</dt><dd>' + ps.length + '</dd>'
    + '<dt>Level-2 decomposed</dt><dd>' + subs + (subs ? '' : ' — this stream is not in the wave 1–2 spine') + '</dd></dl>'
    + '<h2>Processes</h2><div class="tw"><table><thead><tr><th>ID</th><th>Process</th><th>Owner</th><th>Primary output</th><th>Measure</th></tr></thead><tbody>'
    + ps.map(p => '<tr><td class="mono"><span class="lnk" data-p="' + p.id + '">' + p.id + '</span></td><td>' + esc(p.name)
      + '</td><td>' + esc(p.owner) + '</td><td>' + esc(p.output) + '</td><td>' + esc(p.measure) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="note">Click any process to see the sub-processes that execute it, the module that owns them, the control that fires and the features that implement it.</div>';
}

function procDetail(p) {
  const subs = p.subs.map(S);
  const mods = [...new Set(subs.flatMap(x => x.modules))].filter(m => M(m));
  return '<h1>' + p.id + ' · ' + esc(p.name) + '</h1>'
    + '<p class="lede">' + esc(p.output) + '</p>'
    + '<dl class="kv"><dt>Value stream</dt><dd>' + p.stream + ' · ' + esc(D.streams.find(s => s.id === p.stream).name) + '</dd>'
    + '<dt>Accountable owner</dt><dd>' + esc(p.owner) + '</dd>'
    + '<dt>Measure</dt><dd>' + esc(p.measure) + '</dd>'
    + '<dt>Wave</dt><dd>' + (p.wave == null ? 'not sequenced' : (p.wave === 3.1 ? '3a' : p.wave)) + '</dd>'
    + '<dt>Modules</dt><dd>' + (mods.length ? mods.map(m => '<span class="pill mod">' + m + ' ' + esc(M(m).name) + '</span>').join(' ') : (p.module ? '<span class="pill mod">' + esc(p.module) + '</span>' : '—')) + '</dd>'
    + '<dt>Controls</dt><dd>' + (p.controls.length ? p.controls.map(c => '<span class="pill ctl lnk" data-c="' + c + '">' + c + ' ' + esc(C(c).name) + '</span>').join(' ') : '—') + '</dd></dl>'
    + (subs.length
      ? '<h2>Level 2 · ' + subs.length + ' sub-processes</h2>' + subs.map(subDetail).join('')
      : '<div class="note"><b>Not decomposed to level 2.</b> This process belongs to a wave outside the 1–2 spine. '
        + 'Deliverable 13 §7 names the wave it waits for — deferring it was a decision, not an omission.</div>');
}

function subDetail(x) {
  return '<div style="margin:0 0 16px"><div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px">'
    + '<span class="rid mono" style="font-size:12px;font-weight:600;color:var(--copper)">' + x.id + '</span>'
    + '<b style="font-size:14.5px">' + esc(x.name) + '</b>'
    + (x.control && x.control !== '—' ? '<span class="pill ctl">' + esc(x.control) + '</span>' : '')
    + (x.gap ? '<span class="pill bad">no feature</span>' : '<span class="pill ok">' + x.features.length + ' feature' + (x.features.length === 1 ? '' : 's') + '</span>')
    + '</div>'
    + '<div style="font-size:13.2px;color:var(--slate);margin-bottom:7px;line-height:1.55">' + esc(x.flow) + '</div>'
    + (x.gap ? '<div class="note bad"><b>Covered by nothing, deliberately.</b> ' + esc(x.gap) + '</div>' : featRows(x.features))
    + '</div>';
}

function renderControls() {
  $('cols').style.gridTemplateColumns = '1fr';
  $('c1').style.display = $('c2').style.display = 'none';
  const cs = D.controls.filter(c => !q || (c.id + ' ' + c.name + ' ' + c.evidence + ' ' + c.owner + ' ' + c.blocks + ' ' + c.type + ' ' + c.fires).toLowerCase().includes(q));
  $('c3').innerHTML = '<h1>The controls catalogue, and what implements each one</h1>'
    + '<p class="lede">A control with no evidence is a preference. <b>A control with no feature is not even that.</b> '
    + 'Five of these had nothing implementing them until the architecture was crossed with the priced scope — '
    + 'invisible from inside either document, because each was internally complete.</p>'
    + '<div class="tw"><table><thead><tr><th>#</th><th>Control</th><th>Fires in</th><th>Type</th><th>Owner</th><th>Evidence</th><th>Implemented by</th></tr></thead><tbody>'
    + cs.map(c => '<tr><td class="mono">' + c.id + '</td><td><b>' + esc(c.name) + '</b></td>'
      + '<td class="mono">' + c.fires.split(/[,·]/).map(v => v.trim()).map(v => P(v) ? '<span class="lnk" data-p="' + v + '">' + v + '</span>' : esc(v)).join(' ') + '</td>'
      + '<td>' + esc(c.type) + '</td><td>' + esc(c.owner) + '</td><td>' + esc(c.evidence) + '</td>'
      + '<td>' + (c.deferred ? '<span class="pill w">' + esc(c.deferred) + '</span>'
        : c.features.map(f => '<span class="pill mod">' + f + '</span>').join(' ')) + '</td></tr>').join('')
    + '</tbody></table></div>';
}

function renderValidate() {
  $('cols').style.gridTemplateColumns = '1fr';
  $('c1').style.display = $('c2').style.display = 'none';
  const noL2 = D.processes.filter(p => !p.subs.length);
  const noCtrl = D.processes.filter(p => p.subs.length && !p.controls.length);
  $('c3').innerHTML = '<h1>What to check, and what is deliberately open</h1>'
    + '<p class="lede">This page is generated from the documents, so it cannot disagree with them. '
    + '<b>What it cannot tell you is whether the architecture is right</b> — that needs someone who does the work. '
    + 'These are the places to look first.</p>'
    + '<h2>1 · Sub-processes with no feature</h2>'
    + (D.meta.uncovered
      ? '<div class="tw"><table><thead><tr><th>ID</th><th>Sub-process</th><th>Why it is open</th></tr></thead><tbody>'
        + D.subs.filter(x => x.gap).map(x => '<tr><td class="mono">' + x.id + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.gap) + '</td></tr>').join('')
        + '</tbody></table></div><div class="note"><b>A gap with a good reason is a finding, not a defect.</b> '
        + 'The build fails if one of these loses its reason — and a coverage figure is a diagnostic, not a target.</div>'
      : '<div class="note">Every sub-process has at least one feature.</div>')
    + '<h2>2 · Controls not implemented in Phase 1</h2>'
    + '<div class="tw"><table><thead><tr><th>#</th><th>Control</th><th>State</th></tr></thead><tbody>'
    + D.controls.map(c => '<tr><td class="mono">' + c.id + '</td><td>' + esc(c.name) + '</td><td>'
      + (c.deferred ? '<span class="pill w">' + esc(c.deferred) + '</span>' : '<span class="pill ok">' + c.features.join(', ') + '</span>') + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<h2>3 · Processes not decomposed to level 2 — ' + noL2.length + ' of ' + D.meta.l1 + '</h2>'
    + '<div class="note">Every one belongs to a wave outside the 1–2 spine. <b>Deferring them was a decision</b> and '
    + 'deliverable 13 §7 names the wave each waits for. Writing them now would produce rows nobody has validated '
    + 'against a wave eighteen months away whose scope will move.</div>'
    + '<div class="tw"><table><thead><tr><th>ID</th><th>Process</th><th>Stream</th><th>Owner</th><th>Wave</th></tr></thead><tbody>'
    + noL2.map(p => '<tr><td class="mono"><span class="lnk" data-p="' + p.id + '">' + p.id + '</span></td><td>' + esc(p.name)
      + '</td><td>' + p.stream + '</td><td>' + esc(p.owner) + '</td><td>' + (p.wave == null ? '—' : (p.wave === 3.1 ? '3a' : p.wave)) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<h2>4 · Decomposed processes with no control firing in them — ' + noCtrl.length + '</h2>'
    + '<div class="note">Not every process needs a control. <b>Read this list and ask whether any of them should have one</b> — '
    + 'it is the question the controls catalogue cannot ask about itself.</div>'
    + (noCtrl.length ? '<div class="tw"><table><thead><tr><th>ID</th><th>Process</th><th>Owner</th></tr></thead><tbody>'
      + noCtrl.map(p => '<tr><td class="mono"><span class="lnk" data-p="' + p.id + '">' + p.id + '</span></td><td>' + esc(p.name) + '</td><td>' + esc(p.owner) + '</td></tr>').join('')
      + '</tbody></table></div>' : '');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-s],[data-p],[data-c],[data-view]');
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === t)); return render(); }
  if (t.dataset.s) { sel.stream = t.dataset.s; sel.proc = null; return render(); }
  if (t.dataset.p) {
    const p = P(t.dataset.p); if (!p) return;
    view = 'explore'; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === 'explore'));
    sel.stream = p.stream; sel.proc = p.id; render(); $('c3').scrollTop = 0; return;
  }
  if (t.dataset.c) { view = 'controls'; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === 'controls')); return render(); }
});
$('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
render();
</script>
</body>
</html>
